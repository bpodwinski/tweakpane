<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual test — blades</title>
    <style>
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
        caret-color: transparent !important;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f0f0f0;
      }
      #pane {
        width: 256px;
      }
    </style>
  </head>
  <body>
    <div id="pane"></div>
    <script type="module">
      import { Pane } from '../../docs/assets/tweakpane.js';

      const pane = new Pane({
        container: document.getElementById('pane'),
        title: 'Blades',
      });

      const folder = pane.addFolder({ title: 'Folder', expanded: true });
      folder.addBlade({
        view: 'slider',
        label: 'brightness',
        min: 0,
        max: 1,
        value: 0.5,
      });
      folder.addBlade({
        view: 'list',
        label: 'mode',
        options: [
          { text: 'Alpha', value: 'a' },
          { text: 'Beta', value: 'b' },
        ],
        value: 'a',
      });

      pane.addButton({ title: 'Action' });

      const tab = pane.addTab({
        pages: [{ title: 'Tab A' }, { title: 'Tab B' }],
      });
      tab.pages[0].addBlade({
        view: 'slider',
        label: 'value',
        min: 0,
        max: 100,
        value: 42,
      });

      document.fonts.ready.then(() => {
        document.body.dataset.ready = 'true';
      });
    </script>
  </body>
</html>
