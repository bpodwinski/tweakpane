name: Docs

# Builds the static doc site (packages/tweakpane/docs, gitignored — see
# .gitignore) and deploys it to GitHub Pages on every push to main.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (enabled once via the API when this workflow was added).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run setup
      - name: Build docs
        run: cd packages/tweakpane && npm run doc:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/tweakpane/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
