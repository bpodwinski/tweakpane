name: Visual
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visual-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Kept in sync with the Node version pinned in ci.yml: a single
          # root `npm ci` across the npm workspace also has to build the
          # `canvas` devDependency used by packages/core's jsdom tests,
          # which only ships prebuilt binaries up to Node 21's ABI.
          node-version: '20'
      - run: npm ci
      - run: npm run setup
      - name: Cache Playwright browser binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/tweakpane
      - run: npx playwright test -c test-visual/playwright.config.ts --project=${{ matrix.browser }}
        working-directory: packages/tweakpane
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/tweakpane/test-visual/playwright-report/
          retention-days: 14
